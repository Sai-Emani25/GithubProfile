<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
	<defs>
		<style>
			.title {
				font-family: 'Courier New', monospace;
				font-size: 40px;
				font-weight: bold;
				fill: #00ff88;
				animation: blink 0.8s infinite;
			}
			.bio { font-family: 'Courier New', monospace; font-size: 20px; fill: #e0e0e0; }
			.bio-highlight { fill: #00ff88; }
			.skill-text { font-family: 'Courier New', monospace; font-size: 16px; fill: #e0e0e0; }
			@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0.7; } }
			@media (prefers-color-scheme: dark) { .bio { fill: #c0c0c0; } }
		</style>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0a23"/>
			<stop offset="30%" stop-color="#1a1a3a"/>
			<stop offset="70%" stop-color="#0f0f2a"/>
			<stop offset="100%" stop-color="#0a0a23"/>
		</linearGradient>
		<linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="rgba(0,212,255,0.2)"/>
			<stop offset="100%" stop-color="rgba(255,107,53,0.2)"/>
		</linearGradient>
	</defs>
	<rect width="800" height="280" fill="url(#bgGrad)" rx="20"/>
	
	<!-- Title -->
	<text x="40" y="70" class="title">Sai Emani 👨‍💻 | DevOps Engineer</text>
	
	<!-- Bio -->
	<text x="40" y="130" class="bio">🔥 Building AI-integrated CI/CD Pipelines from Scratch</text>
	<text x="40" y="165" class="bio">📍 Bangalore, India | <tspan class="bio-highlight">Portfolio</tspan></text>
	
	<!-- Skills row 1 -->
	<g transform="translate(40, 205)">
		<rect x="0" y="0" width="115" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="15" y="22" class="skill-text">🐳 Docker</text>
		
		<rect x="125" y="0" width="160" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="140" y="22" class="skill-text">☸️ Kubernetes</text>
		
		<rect x="295" y="0" width="130" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="310" y="22" class="skill-text">🔧 Jenkins</text>
		
		<rect x="435" y="0" width="95" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="450" y="22" class="skill-text">🌐 AWS</text>
	</g>
	
	<!-- Skills row 2 -->
	<g transform="translate(40, 245)">
		<rect x="0" y="0" width="120" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="15" y="22" class="skill-text">💻 Python</text>
		
		<rect x="130" y="0" width="140" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="145" y="22" class="skill-text">⚙️ Terraform</text>
		
		<rect x="280" y="0" width="130" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="295" y="22" class="skill-text">🐍 Ansible</text>
		
		<rect x="420" y="0" width="155" height="34" rx="17" fill="url(#tagGrad)" stroke="rgba(0,255,136,0.5)" stroke-width="2"/>
		<text x="435" y="22" class="skill-text">📊 Prometheus</text>
	</g>
</svg>
