<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
	<defs>
		<style>
			.container { 
				font-family: 'Courier New', monospace; 
				font-size: 28px; 
				fill: none; 
				stroke: none; 
			}
			.title {
				font-size: 42px; 
				font-weight: bold;
				background: linear-gradient(90deg, #00d4ff, #ff6b35, #f7931e, #00ff88);
				background-size: 300% 100%;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				animation: gradient 3s ease infinite, typing 3.5s steps(30) infinite, blink 0.8s infinite;
				border-right: 4px solid #00ff88;
				white-space: nowrap; 
				overflow: hidden; 
				width: 0;
			}
			.bio {
				font-size: 20px; 
				margin-top: 20px;
				color: #e0e0e0; 
				animation: fadeIn 2s ease-in 2.8s forwards;
				opacity: 0;
			}
			.skills {
				display: flex; 
				gap: 12px; 
				margin-top: 15px; 
				font-size: 22px;
				animation: slideIn 1.2s ease-out 3.8s forwards; 
				opacity: 0; 
				transform: translateX(-20px);
			}
			.skill-tag {
				background: linear-gradient(45deg, rgba(0,212,255,0.2), rgba(255,107,53,0.2));
				padding: 4px 12px;
				border-radius: 20px;
				border: 1px solid rgba(0,255,136,0.4);
			}
			@keyframes typing { from { width: 0; } to { width: 100%; } }
			@keyframes blink { 0%, 50% { border-color: #00ff88; } 51%, 100% { border-color: transparent; } }
			@keyframes gradient { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
			@keyframes fadeIn { to { opacity: 1; } }
			@keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
			@media (prefers-color-scheme: dark) { .bio { color: #c0c0c0; } }
		</style>
	</defs>
	<rect width="800" height="250" fill="url(#bgGrad)"/>
	<defs>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0a23"/>
			<stop offset="50%" stop-color="#1a1a3a"/>
			<stop offset="100%" stop-color="#0a0a23"/>
		</linearGradient>
	</defs>
	<foreignObject x="50" y="60" width="700" height="200">
		<div class="container">
			<div class="title">Sai Emani 👨‍💻 | DevOps Engineer</div>
			<div class="bio">
				AI-integrated CI/CD Pipelines 🚀 | Bangalore, India<br>
				<a href="https://sai-emani25.github.io/Portfolio" style="color: #00ff88;">sai-emani25.github.io/Portfolio</a>
			</div>
			<div class="skills">
				<span class="skill-tag">🐳 Docker</span>
				<span class="skill-tag">☸️ Kubernetes</span>
				<span class="skill-tag">🔧 Jenkins</span>
				<span class="skill-tag">🌐 AWS</span>
				<span class="skill-tag">💻 Python</span>
				<span class="skill-tag">⚙️ Terraform</span>
			</div>
		</div>
	</foreignObject>
</svg>
