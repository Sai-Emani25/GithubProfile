<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
	<defs>
		<style>
			.container { 
				font-family: 'Courier New', monospace; 
				font-size: 28px; 
				fill: none; 
				stroke: none; 
			}
			.title {
				font-size: 42px; 
				font-weight: bold;
				background: linear-gradient(90deg, #00d4ff, #ff6b6b, #4ecdc4, #45b7d1);
				background-size: 300% 100%;
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
				animation: gradient 4s ease infinite, typing 4s steps(25) infinite, blink 1s infinite;
				border-right: 4px solid #00d4ff;
				white-space: nowrap; 
				overflow: hidden; 
				width: 0;
			}
			.bio {
				font-size: 20px; 
				margin-top: 20px;
				color: #e0e0e0; 
				animation: fadeIn 2s ease-in 3s forwards;
				opacity: 0;
			}
			.skills {
				display: flex; 
				gap: 15px; 
				margin-top: 15px; 
				font-size: 24px;
				animation: slideIn 1s ease-out 4s forwards; 
				opacity: 0; 
				transform: translateX(-20px);
			}
			@keyframes typing { 
				from { width: 0; } 
				to { width: 100%; } 
			}
			@keyframes blink { 
				0%, 50% { border-color: #00d4ff; } 
				51%, 100% { border-color: transparent; } 
			}
			@keyframes gradient { 
				0%, 100% { background-position: 0% 50%; } 
				50% { background-position: 100% 50%; } 
			}
			@keyframes fadeIn { 
				to { opacity: 1; } 
			}
			@keyframes slideIn { 
				to { opacity: 1; transform: translateX(0); } 
			}
			@media (prefers-color-scheme: dark) { 
				.bio { color: #c0c0c0; } 
			}
		</style>
	</defs>
	<rect width="800" height="250" fill="url(#bgGrad)"/>
	<defs>
		<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#0a0a23"/>
			<stop offset="50%" stop-color="#1a1a3a"/>
			<stop offset="100%" stop-color="#0a0a23"/>
		</linearGradient>
	</defs>
	<foreignObject x="50" y="60" width="700" height="200">
		<div class="container">
			<div class="title">Sai Emani 👨‍💻 | Aspiring DevOps Engineer</div>
			<div class="bio">
				Building AI-integrated CI/CD pipelines from scratch 🚀<br>
				India | sai-emani25.github.io/Portfolio
			</div>
			<div class="skills">
				<span>🐳 Docker</span>
				<span>☸️ Kubernetes</span>
				<span>🔧 CI/CD</span>
				<span>🤖 AI</span>
				<span>⚡ Automation</span>
			</div>
		</div>
	</foreignObject>
</svg>
